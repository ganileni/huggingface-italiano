name: Pubblica la traduzione italiana
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Installa il solo strumento di analisi JavaScript
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Costruisci e verifica la traduzione
        run: npm run check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
